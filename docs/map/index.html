<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>d2-lab Atlas</title>
<!--
  d2-lab Atlas: a zoomable map of the repo (Map tab) and one build followed
  through the engine (Walkthrough tab).

  Open this file in a browser, straight from the repo: it needs no server
  and no build. Edit here, check, commit.

  Files, loaded in this order as plain scripts sharing two globals:
    data-zones.js           world size, repo frame, overview panel, zones
    data-nodes.js           bricks: one replaceable component each
    data-edges.js           arrows between bricks and zones
    engine.js               draws and runs the map; holds no content
    data-walkthrough.js     GENERATED by `bun run map:walkthrough`; never edit
    data-walkthrough-text.js  the words of the Walkthrough tab
    walkthrough.js          renders the Walkthrough tab; holds no content
    check.js                validates the map data (run with bun, see below)

  Check, then commit:
  1. bun docs/map/check.js, and bun test apps/ias/test/map-walkthrough.test.ts
  2. Open docs/map/index.html in a browser (agent-browser open file://...)
     and look at the overview, the zone you changed and the Walkthrough tab.
  3. Commit. A change that adds, removes or rewires a component of the repo
     updates the map in the same commit.

  The site's look: the Braise tokens of apps/ias/src/styles/braise.css, dark
  only, Cinzel and Alegreya Sans.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700&family=Cinzel:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a header with two tabs; Map = zoomable sheet beside a reading panel, Walkthrough = one scrolling column of numbered steps. Dark only, like the site. */
:root {
  color-scheme: dark;
  --bg: #060607;
  --sheet: #0a0b0c;
  --surface: #0d0f10;
  --raised: #14171a;
  --ink: #e3cebb;
  --ink-2: #bbbabb;
  --ink-3: #8a8789;
  --line: #2a2e31;
  --grid: rgba(227, 206, 187, 0.035);
  --accent: #ce8136;
  --now: #f4d69b;
  --now-surface: #3b3321;
  --next: #a0cea7;
  --item: #c7b377;
  --deny: #d9584b;
  /* One hue per zone, grouped: game side gold, core ember, link blue, screen rose and violet, checks green, delivery periwinkle. */
  --z-ext: #8f969c;
  --z-extraction: #c9b26f;
  --z-data: #e2a24f;
  --z-contracts: #c8b8a6;
  --z-engine: #e76f45;
  --z-share-link: #6f9be0;
  --z-ui: #e58fa8;
  --z-attack-view: #c58be0;
  --z-app-shell: #b5c27a;
  --z-golden: #8fd19e;
  --z-tests: #6cc5bd;
  --z-ci: #8f9ff0;
  --z-agent-docs: #a3d4f0;
  --f-display: "Cinzel", Georgia, serif;
  --f-body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}

html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 16px; line-height: 1.5;
  font-variant-numeric: lining-nums;
  display: flex; flex-direction: column;
  padding-inline: 16px; padding-block: 0 12px; box-sizing: border-box;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
a { color: var(--accent); }
code { font-family: var(--f-mono); font-size: 0.84em; background: var(--raised); padding: 1px 4px; border-radius: 3px; color: var(--ink); }

.top {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 22px;
  padding-block: 14px 10px;
}
.top h1 {
  margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 28px;
  letter-spacing: 0.04em; line-height: 1; color: var(--ink);
}
.top h1 span { color: var(--accent); }
.tabs { display: flex; gap: 4px; }
.tabs button {
  font-family: var(--f-display); font-weight: 600; font-size: 14px; letter-spacing: 0.08em;
  color: var(--ink-2); background: none; border: 1px solid transparent; border-radius: 4px;
  padding: 5px 12px; cursor: pointer;
}
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { color: var(--ink); border-color: var(--line); background: var(--surface); }
.crumbs {
  margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 4px;
  font-size: 14px; font-weight: 500;
}
.crumbs button {
  font: inherit; color: var(--ink-2); background: none; border: 0; padding: 2px 4px; cursor: pointer; border-radius: 3px;
}
.crumbs button:hover { color: var(--accent); }
.crumbs button[aria-current="true"] { color: var(--ink); cursor: default; }
.crumbs .sep { color: var(--ink-3); }

.view { flex: 1; min-height: 0; }
.app { display: grid; grid-template-columns: minmax(0, 1fr) 410px; gap: 14px; }
.stage {
  position: relative; min-width: 0; min-height: 0;
  background: var(--sheet); border: 1px solid var(--line); border-radius: 6px; overflow: hidden;
}
#map { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
#map.dragging { cursor: grabbing; }

.controls { position: absolute; top: 10px; left: 10px; display: flex; gap: 6px; }
.controls button, .panel .nav button, .chip, .controls-row button {
  font-family: var(--f-body); font-weight: 500; font-size: 14px;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 4px;
  padding: 4px 10px; cursor: pointer; line-height: 1.25;
}
.controls button:hover, .panel .nav button:hover, .chip:hover, .controls-row button:hover { border-color: var(--accent); color: var(--accent); }
.controls .sq { width: 30px; padding-inline: 0; }
button:focus-visible, .hit:focus-visible, a:focus-visible, .cell:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.legend {
  position: absolute; left: 10px; bottom: 10px; display: flex; flex-wrap: wrap; gap: 4px 14px;
  background: color-mix(in srgb, var(--surface) 90%, transparent); border: 1px solid var(--line); border-radius: 4px;
  padding: 5px 10px; font-size: 13px; color: var(--ink-2); max-width: calc(100% - 20px);
}
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend svg { width: 26px; height: 8px; overflow: visible; }
.hint {
  position: absolute; right: 10px; top: 12px; margin: 0; font-size: 13px; color: var(--ink-3);
  background: color-mix(in srgb, var(--sheet) 85%, transparent); padding: 2px 6px; border-radius: 3px;
}

.panel {
  min-width: 0; min-height: 0; overflow-y: auto;
  background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
  padding: 18px 20px 22px;
}
.panel .kicker, .wt .kicker {
  font-family: var(--f-mono); font-size: 12px; color: var(--ink-3); margin: 0 0 6px; overflow-wrap: anywhere;
}
.panel .kicker code, .wt .kicker code { background: none; padding: 0; color: var(--ink-2); }
.panel h2 {
  font-family: var(--f-display); font-weight: 700; font-size: 24px; line-height: 1.15; letter-spacing: 0.02em;
  margin: 0 0 10px; text-wrap: balance; display: flex; align-items: center; gap: 10px;
}
.panel h2 .swatch { width: 12px; height: 12px; border-radius: 2px; flex: none; background: var(--zc, var(--ink-3)); }
.panel h3, .wt h3 {
  font-family: var(--f-display); font-weight: 600; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--ink-2); margin: 18px 0 6px;
}
.panel p { margin: 0 0 8px; }
.panel .lead { font-size: 16.5px; }
.panel ul { margin: 0; padding-left: 18px; }
.panel li { margin-bottom: 6px; }
.panel li::marker { color: var(--zc, var(--ink-3)); }
.panel .alt { color: var(--ink-2); }
.panel .warn {
  border-left: 3px solid var(--accent); padding: 6px 10px; background: var(--raised); border-radius: 0 4px 4px 0; font-size: 15px;
}
.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 14px; margin: 0; font-size: 15px; }
.facts dt { color: var(--ink-2); }
.facts dd { margin: 0; font-variant-numeric: lining-nums tabular-nums; overflow-wrap: anywhere; min-width: 0; }
.panel .facts dd { font-family: var(--f-mono); font-size: 13px; }
.panel .facts.io dd { font-family: var(--f-body); font-size: 15px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 14px; padding: 3px 9px; }
.chip .dot { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; background: var(--zc, var(--ink-3)); }
.panel .points, .panel .flows { list-style: none; padding: 0; }
.panel .flows li { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-bottom: 6px; }
.panel .flow { color: var(--ink-2); font-size: 14px; }
.panel .points li { margin-bottom: 10px; }
.panel .points .chip { margin-top: 4px; }
.panel .label { font-size: 14px; color: var(--ink-2); margin: 10px 0 6px; }
.panel .src { font-family: var(--f-mono); font-size: 12px; color: var(--ink-3); margin-top: 16px; overflow-wrap: anywhere; }
.panel .nav { display: flex; justify-content: space-between; gap: 8px; margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--line); }

/* SVG world. Sizes are world units, so text grows with the zoom. Frame and zone borders keep a constant screen width. */
.w-frame { fill: none; stroke: var(--ink-3); stroke-width: 1.4; vector-effect: non-scaling-stroke; }
.w-frame-title { font-family: var(--f-display); font-weight: 700; font-size: 34px; fill: var(--ink); letter-spacing: 0.05em; }
.w-frame-sub { font-family: var(--f-mono); font-size: 13px; fill: var(--ink-2); }
.w-group { fill: color-mix(in srgb, var(--accent) 2.5%, transparent); stroke: color-mix(in srgb, var(--accent) 45%, var(--line)); stroke-width: 1.4; stroke-dasharray: 10 6; vector-effect: non-scaling-stroke; }
.w-group-title { font-family: var(--f-display); font-weight: 700; font-size: 22px; fill: var(--accent); letter-spacing: 0.06em; }
.w-group-sub { font-family: var(--f-mono); font-size: 12px; fill: var(--ink-2); }
.w-label { font-family: var(--f-display); font-weight: 600; font-size: 13px; fill: var(--ink-3); letter-spacing: 0.14em; }
.zone-bg { vector-effect: non-scaling-stroke; fill: color-mix(in srgb, var(--zc) 6%, var(--sheet)); stroke: color-mix(in srgb, var(--zc) 45%, var(--line)); stroke-width: 1.3; }
.zone.ext .zone-bg { stroke-dasharray: 7 5; fill: color-mix(in srgb, var(--zc) 3%, var(--sheet)); }
.zone .hit-zone { cursor: zoom-in; }
.zone:hover .zone-bg { stroke: var(--zc); }
.zone.focused .zone-bg { stroke: var(--zc); stroke-width: 2.2; }
.z-title { font-family: var(--f-display); font-weight: 700; font-size: 28px; fill: var(--zc); letter-spacing: 0.06em; }
.z-tag { font-family: var(--f-mono); font-size: 14px; fill: var(--ink-2); }
.z-kw { font-family: var(--f-body); font-size: 20px; fill: var(--ink); }
.z-kw-mark { fill: var(--zc); }
.z-near-title { font-family: var(--f-display); font-weight: 700; font-size: 9px; fill: var(--zc); letter-spacing: 0.08em; }
.z-near-tag { font-family: var(--f-mono); font-size: 5.4px; fill: var(--ink-3); }

/* Node kinds (`kind` in the data): none = brick inside a zone, read zoomed in; big = outside system, read at overview scale; off = dashed. engine.js SIZES must match these font sizes. */
.node .box { fill: var(--surface); stroke: color-mix(in srgb, var(--zc) 55%, var(--line)); stroke-width: 0.8; }
.node.off .box { stroke-dasharray: 3 2; fill: var(--sheet); }
.node .lbl { font-family: var(--f-body); font-weight: 700; font-size: 8.6px; fill: var(--ink); }
.node .sub { font-family: var(--f-mono); font-size: 5.3px; fill: var(--ink-2); }
.node.off .lbl { fill: var(--ink-2); }
.node.big .lbl { font-size: 21px; }
.node.big .sub { font-size: 12px; }
.node.big .box { stroke-width: 1.3; }
.node { cursor: pointer; }
.node:hover .box { stroke: var(--zc); }
.node.selected .box { stroke: var(--accent); stroke-width: 1.8; }
.node.coupled .box { stroke: var(--accent); stroke-width: 1.3; stroke-dasharray: 3 2; fill: color-mix(in srgb, var(--accent) 10%, var(--surface)); }
.node.big.coupled .box { stroke-width: 2.4; stroke-dasharray: 8 5; }
.node.linked .box { stroke: var(--now); stroke-width: 1.2; fill: color-mix(in srgb, var(--now) 7%, var(--surface)); }
.node.big.linked .box { stroke-width: 2.2; }
.node.big.selected .box { stroke-width: 2.6; }

.edge path { fill: none; stroke: var(--ink-3); stroke-width: 0.9; }
.edge.far path { stroke-width: 2.2; }
.edge.link path { stroke: color-mix(in srgb, var(--ink-3) 80%, transparent); stroke-width: 0.7; }
.edge.deny path { stroke: var(--deny); }
.edge.dash path { stroke-dasharray: 3 2.4; }
.edge.far.dash path { stroke-dasharray: 8 6; }
.edge.hot path { stroke: var(--accent); stroke-width: 1.5; }
.edge.far.hot path { stroke-width: 3.2; }
.elabel { font-family: var(--f-mono); font-size: 5px; fill: var(--ink-2); paint-order: stroke; stroke: var(--sheet); stroke-width: 2.4px; stroke-linejoin: round; }
.edge.far .elabel { font-size: 15px; stroke-width: 5px; }
.edge.deny .elabel { fill: var(--deny); }
.edge.hot .elabel { fill: var(--accent); }
.arrowhead { fill: var(--ink-3); }
.arrowhead.deny { fill: var(--deny); }
.arrowhead.hot { fill: var(--accent); }

.cartouche rect { fill: var(--surface); stroke: var(--ink-3); stroke-width: 1.2; }
.cartouche line { stroke: var(--ink-3); stroke-width: 0.8; }
.cartouche .k { font-family: var(--f-display); font-weight: 600; font-size: 11px; fill: var(--ink-3); letter-spacing: 0.1em; }
.cartouche .v { font-family: var(--f-mono); font-size: 13px; fill: var(--ink); }
.cartouche .t { font-family: var(--f-display); font-weight: 700; font-size: 22px; fill: var(--ink); }

.lod-far { opacity: var(--far, 1); }
.lod-near { opacity: var(--near, 0); }
#map:not(.near) .lod-near { pointer-events: none; }
#map.near .lod-far { pointer-events: none; }

/* Walkthrough */
#walkthrough { overflow-y: auto; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
.wt { max-width: 980px; margin-inline: auto; padding: 26px 22px 34px; }
.wt-head h2 { font-family: var(--f-display); font-weight: 700; font-size: 28px; margin: 0 0 8px; letter-spacing: 0.02em; text-wrap: balance; }
.wt .lead { max-width: 68ch; margin: 0 0 10px; color: var(--ink); }
.wt .open { margin: 0 0 20px; }
.step { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 16px; }
.rail { display: flex; flex-direction: column; align-items: center; }
.rail .num {
  width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center;
  font-family: var(--f-display); font-weight: 700; font-size: 15px; color: var(--bg); background: var(--accent);
}
.rail .line { flex: 1; width: 1px; background: var(--line); margin-block: 6px; }
.step:last-of-type .rail .line { visibility: hidden; }
.step .body { min-width: 0; padding-bottom: 30px; }
.step h2 { font-family: var(--f-display); font-weight: 700; font-size: 21px; margin: 0 0 8px; letter-spacing: 0.02em; text-wrap: balance; }
.values { margin-block: 12px; padding: 14px 16px; background: var(--sheet); border: 1px solid var(--line); border-radius: 6px; min-width: 0; }
.wt .then { margin: 10px 0 0; color: var(--ink-2); font-size: 15px; max-width: 72ch; }
.wt .facts dt { white-space: nowrap; }
.wt .facts .n { font-family: var(--f-mono); font-size: 12px; color: var(--ink-3); margin-left: 4px; }
.wt .big { font-family: var(--f-mono); font-size: 18px; color: var(--now); }
.wt .src { display: block; font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-3); overflow-wrap: anywhere; }
.tag { font-family: var(--f-mono); font-size: 12.5px; padding: 2px 7px; border-radius: 3px; background: var(--raised); border: 1px solid var(--line); color: var(--ink); }
.tag.on { border-color: color-mix(in srgb, var(--next) 45%, var(--line)); }
.tag.off { color: var(--ink-3); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--ink-3) 60%, transparent); }
.url { font-family: var(--f-mono); font-size: 13.5px; margin: 0 0 12px; overflow-wrap: anywhere; color: var(--ink-2); }
.url .host { color: var(--ink-3); }
.url .q b { color: var(--accent); font-weight: 500; }
.scroll { overflow-x: auto; }
.wt table { border-collapse: collapse; font-size: 15px; font-variant-numeric: lining-nums tabular-nums; min-width: 100%; }
.wt caption { text-align: left; color: var(--ink-2); font-size: 14px; padding-bottom: 6px; }
.wt th { text-align: left; font-weight: 500; color: var(--ink-2); font-size: 13.5px; padding: 4px 14px 6px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
.wt td { padding: 5px 14px 5px 0; border-bottom: 1px solid color-mix(in srgb, var(--line) 60%, transparent); white-space: nowrap; }
.wt td.was { color: var(--ink-3); }
.wt td.now { color: var(--now); }
.wt td.why { color: var(--ink-2); white-space: normal; }
.bp tr.is-now td { background: var(--now-surface); color: var(--now); }
.pill { font-family: var(--f-display); font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: var(--bg); background: var(--now); border-radius: 3px; padding: 1px 6px; }
.sum { display: grid; gap: 6px; }
.term { display: grid; grid-template-columns: 22px minmax(84px, max-content) minmax(0, 1fr); gap: 10px; align-items: baseline; }
.term .sign { font-family: var(--f-mono); color: var(--ink-3); text-align: center; }
.term .v { font-family: var(--f-mono); font-size: 16px; color: var(--ink); }
.term .k { color: var(--ink-2); font-size: 15px; }
.term.total { border-top: 1px solid var(--line); padding-top: 6px; }
.term.total .v { color: var(--now); font-size: 18px; }
.player { display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-start; }
#sprite { image-rendering: pixelated; background: radial-gradient(60% 50% at 50% 70%, rgb(110 36 20 / 0.28), transparent), var(--bg); border: 1px solid var(--line); border-radius: 6px; max-width: 100%; }
.player .side { flex: 1; min-width: 240px; display: grid; gap: 12px; align-content: start; }
.controls-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.controls-row .slow { font-size: 14px; color: var(--ink-2); display: inline-flex; gap: 6px; align-items: center; }
.counter { margin: 0; font-family: var(--f-mono); font-size: 13px; color: var(--ink-2); min-height: 1.5em; }
.strip { display: grid; grid-template-columns: repeat(auto-fill, minmax(26px, 1fr)); gap: 3px; margin-top: 14px; }
.cell {
  height: 30px; border-radius: 3px; display: grid; place-items: center; cursor: pointer;
  font-family: var(--f-mono); font-size: 12px; color: var(--bg);
  background: color-mix(in srgb, var(--accent) 22%, var(--raised));
}
.cell[data-seg="1"] { background: color-mix(in srgb, var(--next) 18%, var(--raised)); }
.cell.hit { background: var(--accent); }
.cell[data-seg="1"].hit { background: var(--next); }
.cell.at { outline: 2px solid var(--now); outline-offset: 1px; }
.wt .foot { color: var(--ink-3); font-size: 14px; border-top: 1px solid var(--line); padding-top: 14px; margin: 0; }

@media (max-width: 860px) {
  html, body { height: auto; }
  body { display: block; }
  .app { display: flex; flex-direction: column; }
  .stage { height: 64vh; min-height: 360px; }
  .panel { overflow: visible; }
  .crumbs { margin-left: 0; width: 100%; }
  .hint { display: none; }
  #walkthrough { overflow: visible; }
  .wt { padding: 18px 14px 24px; }
  .step { grid-template-columns: 30px minmax(0, 1fr); gap: 10px; }
  .rail .num { width: 26px; height: 26px; font-size: 13px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<header class="top">
  <h1>d2-lab <span>Atlas</span></h1>
  <div class="tabs" role="tablist" aria-label="Views">
    <button type="button" role="tab" id="tab-map" aria-controls="view-map" aria-selected="true">Map</button>
    <button type="button" role="tab" id="tab-walkthrough" aria-controls="walkthrough" aria-selected="false">Walkthrough</button>
  </div>
  <nav class="crumbs" id="crumbs" aria-label="Position on the map"></nav>
</header>

<main class="view app" id="view-map" role="tabpanel" aria-labelledby="tab-map">
  <section class="stage" aria-label="Zoomable map">
    <svg id="map" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="Architecture of the d2-lab repo: game files, extraction, the app layers, tests, CI and agent context"></svg>
    <div class="controls">
      <button type="button" id="btn-home">Overview</button>
      <button type="button" id="btn-out" class="sq" aria-label="Zoom out">−</button>
      <button type="button" id="btn-in" class="sq" aria-label="Zoom in">+</button>
    </div>
    <p class="hint">wheel or pinch to zoom · drag to move · Esc to go up</p>
    <div class="legend" aria-label="Legend">

<script>
  // Tabs: #walkthrough opens the Walkthrough tab; any other hash belongs to the map.
  (() => {
    const tabs = { map: document.getElementById("tab-map"), walkthrough: document.getElementById("tab-walkthrough") };
    const views = { map: document.getElementById("view-map"), walkthrough: document.getElementById("walkthrough") };
    const crumbs = document.getElementById("crumbs");
    const show = (name) => {
      for (const key of Object.keys(tabs)) {
        tabs[key].setAttribute("aria-selected", String(key === name));
        views[key].hidden = key !== name;
      }
      crumbs.hidden = name !== "map";
      if (name === "walkthrough") {
        window.MAP_WALKTHROUGH_VIEW.shown();
        try { history.replaceState(null, "", "#walkthrough"); } catch (_) { /* sandboxed frame */ }
      } else {
        window.MAP_WALKTHROUGH_VIEW.hidden();
        try { history.replaceState(null, "", location.pathname); } catch (_) { /* sandboxed frame */ }
      }
    };
    tabs.map.addEventListener("click", () => show("map"));
    tabs.walkthrough.addEventListener("click", () => show("walkthrough"));
    if (window.MAP_INITIAL_HASH === "#walkthrough") show("walkthrough");
  })();
</script>
